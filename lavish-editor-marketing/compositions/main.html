<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main-content"
      data-start="0"
      data-duration="33.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        data-composition-id="scene-terminal-host"
        data-composition-src="scene-terminal.html"
        data-start="0"
        data-duration="33.5"
      ></div>
      <div
        data-composition-id="scene-editor-host"
        data-composition-src="scene-editor.html"
        data-start="0"
        data-duration="33.5"
      ></div>
      <div
        data-composition-id="scene-zoom-host"
        data-composition-src="scene-zoom.html"
        data-start="0"
        data-duration="33.5"
      ></div>
      <div
        data-composition-id="scene-outro-host"
        data-composition-src="scene-outro.html"
        data-start="0"
        data-duration="33.5"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main-content"] = gsap.timeline({ paused: true });
    </script>
    <script src="main-timeline.js"></script>
  </body>
</html>
