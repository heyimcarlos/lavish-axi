<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="scene-outro"
      data-start="0"
      data-duration="33.5"
      data-width="1920"
      data-height="1080"
    >
      <section id="scene-outro" class="scene">
        <div class="scene-content outro">
          <div class="outro-brand"><span class="lavish">Lavish</span><span class="editor-word">Editor</span></div>
          <p>For when a rich editor is not rich enough.</p>
          <code>npx lavish-axi</code>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-outro"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
